<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Website Registration</title>
  <!--bootstrap stuff will be added-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<script>
function HandleRegisterResponse(response) {
    let data;
    try {
        data = JSON.parse(response);
    } catch (e) {
        document.getElementById("textResponse").innerHTML = "Invalid server response";
        return;
    }

    if (data.success) {
        document.getElementById("textResponse").innerHTML = 
            `<span class="text-success">${data.message}</span>`;
    } else {
        document.getElementById("textResponse").innerHTML = 
            `<span class="text-danger">${data.message}</span>`;
    }
}

function SendRegisterRequest(username,password)
{
	var request = new XMLHttpRequest();
	request.open("POST","register.php",true);
	request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
	request.onreadystatechange= function ()
	{
		
		if ((this.readyState == 4)&&(this.status == 200))
		{
			HandleRegisterResponse(this.responseText);
		}		
	}
	request.send("type=register&username="+username+"&password="+password); //type is register instead of login
}
</script>


<body class="bg-light">
 <div id="navbar-placeholder"></div>

  <script>
    fetch("navbar.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("navbar-placeholder").innerHTML = data;
      });
  </script>

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-sm" style="min-width: 350px;">
      <h3 class="text-center mb-4">Register an Account</h3>
      <form id="registrationForm" onsubmit="event.preventDefault(); registerUser();">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Create password" required>
        </div>
        <div class="mb-3">
          <label for="confirm-password" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirm-password" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
      </form>
      <div class="mt-3 text-center">
        <small>Already have an account? <a href="index.html">Login</a></small>
      </div>
      <div id="textResponse" class="mt-3 text-center text-danger"></div>
    </div>
  </div>

  <script>
    function registerUser() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (password !== confirmPassword) {
          document.getElementById("textResponse").innerHTML = "Passwords do not match";
          return;
      } else {
          SendRegisterRequest(username, password);
      }
    }
  </script>


  <footer class="bg-dark text-white text-center py-3 mt-5 fixed-bottom">

    <div class="container">
        <p class="mb-0">&copy; 2025 Uhhh.....Inc @. All Rights Reserved</p>
    </div>

  </footer>

</body>

</html>
