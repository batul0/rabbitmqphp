<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>

    :root {
      --bg1: #0f0f14; --bg2: #15151f; --card: #1c1c29; --text: #e8e8ff; --muted: #a9a9c1;
      --accent: #7c4dff; --accent-2: #00ffc6; --chip: #2b2b3b;
    }
    body {
      background: radial-gradient(1200px 600px at 15% 0%, #18182a 0%, var(--bg1) 60%) fixed,
                  linear-gradient(180deg, var(--bg1), var(--bg2)) fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .register-card{
      background: var(--card);
      border: 1px solid rgba(124, 77, 255, 0.25);
      border-radius: 18px;
      padding: 2.2rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    
    .brand{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .brand span{
      font-weight: 800;
      font-size: 1.8rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 0.5px;
    }

    .form-label{ color: var(--muted);}
    .form-control{
      background: #12121b;
      border: 1px solid rgba(124, 77, 255, 0.35);
      color: var(--text);
      border-radius: 10px;
    }
    .form-control:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 .2rem rgba(124, 77, 255, 0.25);;
      background-color: #151525;
      color: var(--text);
    }

    .btn-register{
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border:none;
      color: #0e0e14;
      font-weight: 700;
      padding: 10px 0;
      transition: opacity 0.2s;
      border-radius: 10px;
    }
    .btn-register:hover{ opacity: .9;}

    a{color: var(--accent-2); text-decoration: none;}
    a:hover{text-decoration: underline;}
    
    #responseBox{
      border-radius: 10px;
      border: 1px solid rgba(124, 77, 255, 0.35);
      background: #141420;
      color: var(--text);
    }
  </style>
</head>


<body>
  <div class="register-card">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M4 12l4-8 4 8-4 8-4-8Zm8 0 4-8 4 8-4 8-4-8Z" stroke="url(#g)" stroke-width="1.5"/>
        <defs><linearGradient id="g" x1="0" y1="0" x2="24" y2="24">
          <stop stop-color="#7c4dff"/><stop offset="1" stop-color="#00ffc6"/>
        </linearGradient></defs>
      </svg>
      <span>GameHub</span>
    </div>

    <form id="regForm" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" type="text" class="form-control" required />
        <div class="invalid-feedback">Username is required.</div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" class="form-control" minlength="4" required />
        <div class="invalid-feedback">Password must be at least 4 characters.</div>
      </div>
      <div class="mb-3">
        <label for="confirm" class="form-label">Confirm Password</label>
        <input id="confirm" type="password" class="form-control" required />
        <div class="invalid-feedback">Passwords must match.</div>
      </div>
      <button id="submitBtn" class="btn btn-register w-100" type="submit">Register</button>
    </form>

    <div id="responseBox" class="alert mt-3 d-none"></div>

    <div class="text-center mt-2">
      <a href="index.html">Already have an account? Log in</a>
    </div>
    
  </div>

  <script>
    const form = document.getElementById('regForm');
    const box  = document.getElementById('responseBox');
    const btn  = document.getElementById('submitBtn');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      form.classList.add('was-validated');

      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const c = document.getElementById('confirm').value;

      if (!u || p.length < 4 || p !== c) return;

      btn.disabled = true;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', 'register.php', true);
      xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
      xhr.onreadystatechange = function () {
        if (this.readyState === 4) {
          btn.disabled = false;
          try {
            const res = JSON.parse(this.responseText || '{}');
            box.classList.remove('d-none', 'alert-success', 'alert-danger');

            if (this.status === 200 && res.success) {
              box.classList.add('alert-success');
              box.innerHTML = (res.message || 'Registration successful') + '. Redirecting to login...';
              console.log('✅ Registered user:', u);
              setTimeout(() => { window.location.href = 'index.html'; }, 1200);
            } else {
              box.classList.add('alert-danger');
              box.innerHTML = res.message || 'Registration failed';
              console.log('❌ Registration rejected:', res.message || '(no message)');
            }
          } catch (err) {
            box.classList.remove('d-none');
            box.classList.add('alert-danger');
            box.innerHTML = 'Invalid server response';
            console.error('Parse error:', err, 'Raw response:', this.responseText);
          }
        }
      };
      xhr.send('uname=' + encodeURIComponent(u) + '&pword=' + encodeURIComponent(p));
    });
  </script>
</body>
</html>
