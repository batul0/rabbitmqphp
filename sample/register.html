<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow p-4" style="min-width: 380px;">
      <h3 class="text-center mb-3">Create Account</h3>
      <form id="regForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input id="username" type="text" class="form-control" required />
          <div class="invalid-feedback">Username is required.</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control" minlength="4" required />
          <div class="invalid-feedback">Password must be at least 4 characters.</div>
        </div>
        <div class="mb-3">
          <label for="confirm" class="form-label">Confirm Password</label>
          <input id="confirm" type="password" class="form-control" required />
          <div class="invalid-feedback">Passwords must match.</div>
        </div>
        <button id="submitBtn" class="btn btn-success w-100" type="submit">Register</button>
      </form>

      <div id="responseBox" class="alert mt-3 d-none"></div>

      <div class="text-center mt-2">
        <a href="index.html">Already have an account? Log in</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('regForm');
    const box  = document.getElementById('responseBox');
    const btn  = document.getElementById('submitBtn');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      form.classList.add('was-validated');

      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const c = document.getElementById('confirm').value;

      if (!u || p.length < 4 || p !== c) return;

      btn.disabled = true;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', 'register.php', true);
      xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
      xhr.onreadystatechange = function () {
        if (this.readyState === 4) {
          btn.disabled = false;
          try {
            const res = JSON.parse(this.responseText || '{}');
            box.classList.remove('d-none', 'alert-success', 'alert-danger');

            if (this.status === 200 && res.success) {
              box.classList.add('alert-success');
              box.innerHTML = (res.message || 'Registration successful') + '. Redirecting to login...';
              console.log('✅ Registered user:', u);
              setTimeout(() => { window.location.href = 'index.html'; }, 1200);
            } else {
              box.classList.add('alert-danger');
              box.innerHTML = res.message || 'Registration failed';
              console.log('❌ Registration rejected:', res.message || '(no message)');
            }
          } catch (err) {
            box.classList.remove('d-none');
            box.classList.add('alert-danger');
            box.innerHTML = 'Invalid server response';
            console.error('Parse error:', err, 'Raw response:', this.responseText);
          }
        }
      };
      xhr.send('uname=' + encodeURIComponent(u) + '&pword=' + encodeURIComponent(p));
    });
  </script>
</body>
</html>
