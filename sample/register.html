<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Website Registration</title>
<!--bootstrap stuff will be added-->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<script>
function HandleLoginResponse(response)
{
	var text = JSON.parse(response);
//	document.getElementById("textResponse").innerHTML = response+"<p>";	
	document.getElementById("textResponse").innerHTML = "Response: "+text+"<p>";
}

function SendLoginRequest(username,password)
{
	var request = new XMLHttpRequest();
	request.open("POST","register.php",true);
	request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
	request.onreadystatechange= function ()
	{
		
		if ((this.readyState == 4)&&(this.status == 200))
		{
			HandleLoginResponse(this.responseText);
		}		
	}
	request.send("type=register&uname="+username+"&pword="+password); //type is register instead of login
}
</script>

<h1>Our Website Name</h1>
<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-sm" style="min-width: 350px;">
      <h3 class="text-center mb-4">Register an Account</h3>
      <form id="registrationForm" onsubmit="event.preventDefault(); registerUser">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Create password" required>
        </div>
        <div class="mb-3">
          <label for="confirm-password" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirm-password" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
      </form>
      <div class="mt-3 text-center">
        <small>Already have an account? <a href="index.html">Login</a></small>
      </div>
      <div id="textResponse" class="mt-3 text-center text-danger"></div>
    </div>
  </div>

  <script>
        function registerUser() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm-password").value;

        if (password !== confirmPassword) {
            document.getElementById("textResponse").innerHTML = "Passwords do not match";
            return;
        } else {
            SendLoginRequest(username, password);
        }
}
</script>

</body>

</html>
