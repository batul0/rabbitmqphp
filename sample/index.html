<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex align-items-center justify-content-center" style="height: 100vh;">
  <div class="card shadow p-4" style="min-width: 350px;">
    <h3 class="text-center mb-3">Login</h3>
    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div id="responseBox" class="alert mt-3 d-none"></div>

    <!-- 🔗 Link to registration -->
    <div class="text-center mt-2">
      <a href="register.html">Don’t have an account? Create one</a>
    </div>
  </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  let username = document.getElementById("username").value;
  let password = document.getElementById("password").value;

  let xhr = new XMLHttpRequest();
  xhr.open("POST", "login.php", true);
  xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

  xhr.onreadystatechange = function() {
    if (this.readyState === 4 && this.status === 200) {
      try {
        let res = JSON.parse(this.responseText);
        let box = document.getElementById("responseBox");
        box.classList.remove("d-none", "alert-success", "alert-danger");

        if (res.success) {
          box.classList.add("alert-success");
          box.innerHTML = res.message;
          console.log("✅ Database approved login for user:", res.username);

          const u = res.username || username;
          window.location.href = "home.php";
        } else {
          box.classList.add("alert-danger");
          box.innerHTML = res.message;
          console.log("❌ Database rejected login:", res.message);
        }
      } catch (err) {
        alert("Invalid server response: " + this.responseText);
        console.error("Parse error:", err, "Raw response:", this.responseText);
      }
    }
  };

  xhr.send("uname=" + encodeURIComponent(username) + "&pword=" + encodeURIComponent(password));
});
</script>

</body>
</html>
