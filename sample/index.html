<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>our website login</title>
<!--bootstrap stuff will be added-->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<style>

	.login-container{

		align-items: center;
		justify-content: center;
		background-color: rgb(218, 218, 218);
		display: flex;

	}
	.login-slot{
		width: 100%;
		max-width: 300px;
	}


</style>

</head>




<script>

function HandleLoginResponse(response)
{
	var text = JSON.parse(response);
//	document.getElementById("textResponse").innerHTML = response+"<p>";	
	document.getElementById("textResponse").innerHTML = "response: "+text+"<p>";
}

function SendLoginRequest(username,password)
{
	var request = new XMLHttpRequest();
	request.open("POST","login.php",true);
	request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
	request.onreadystatechange= function ()
	{
		
		if ((this.readyState == 4)&&(this.status == 200))
		{
			HandleLoginResponse(this.responseText);
		}		
	}
	request.send("type=login&uname="+username+"&pword="+password);
}
</script>

<h1>Our website name</h1>
<body>
<div class="login-container">
<div class="card login-slot">
<div class="card-body">
<h3 class="card-title text-center mb-4">Login</h3>
<form id="loginForm">
<div class="mb-3">
	<label for="unameInput" class="form-label">username</label>
	<input type="text" class="form-control" id="unameInput" name="username" required>
</div>
<div class="mb-3">
	<label for="pwordInput" class="form-label">password</label>
	<input type="password" class="form-control" id="pwordInput" name="password" required>
</div>
<div class="d-grid gap-2 mb-3">
	<button type="submit" class="btn btn-primary">login</button>
</div>
<div class="text-center mt-3">
	<small class="text-muted">
		Want to make an account? <a href="register.html">register here </a>
	</small>

</div>
<div id="textResponse">
awaiting response
</div>
<script>
	document.getElementById('loginForm').onsubmit = function(event){
		event.preventDefault();

		const username = document.getElementById("unameInput").value;
		const password = document.getElementById("pwordInput").value;
		document.getElementById("textResponse").textContent = "Sending request";
		SendLoginRequest(username, password);

	};

	
//SendLoginRequest("kehoed","12345");
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

</body>
</html>
